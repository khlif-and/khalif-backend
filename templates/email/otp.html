<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kode Masuk</title>
    <style>
        body { margin: 0; padding: 0; min-width: 100%; background-color: #F2F4F6; }
        table { border-spacing: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1F2937; }
        td { padding: 0; }
        img { border: 0; }
        .wrapper { width: 100%; table-layout: fixed; }
        @media only screen and (max-width: 600px) {
            .outer { width: 90% !important; max-width: 100% !important; }
            .content-padding { padding: 30px 20px !important; }
            .otp-text { font-size: 32px !important; letter-spacing: 6px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F2F4F6;">
    <center class="wrapper" style="width: 100%; table-layout: fixed; background-color: #F2F4F6; padding-bottom: 40px;">
        <div style="max-width: 460px; margin: 0 auto;">
            <table align="center" style="margin: 40px auto 20px auto; width: 100%; text-align: center;">
                <tr>
                    <td>
                        <img src="https://via.placeholder.com/120x40/F2F4F6/5A8F7B?text=KHALIF" width="120" alt="Khalif" style="display: block; margin: auto; font-weight: bold;">
                    </td>
                </tr>
            </table>
            <table class="outer" align="center" style="background-color: #ffffff; width: 100%; max-width: 460px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03);">
                <tr>
                    <td class="content-padding" style="padding: 40px 30px;">
                        <table width="100%">
                            <tr>
                                <td align="center" style="padding-bottom: 20px;">
                                    <img src="https://cdn-icons-png.flaticon.com/512/9402/9402289.png" width="60" height="60" alt="Lock" style="display: block; margin: auto;">
                                </td>
                            </tr>
                            <tr>
                                <td align="center" style="padding-bottom: 10px;">
                                    <h2 style="font-size: 20px; font-weight: 800; color: #111827; margin: 0; letter-spacing: -0.5px;">Kode Masuk</h2>
                                </td>
                            </tr>
                            <tr>
                                <td align="center" style="padding-bottom: 30px;">
                                    <p style="font-size: 15px; color: #6B7280; line-height: 24px; margin: 0;">
                                        Nih kode OTP kamu. <br>Bismillah dulu sebelum disalin ya!
                                    </p>
                                </td>
                            </tr>
                            <tr>
                                <td align="center" style="padding-bottom: 30px;">
                                    <table border="0" cellspacing="0" cellpadding="0" width="100%">
                                        <tr>
                                            <td align="center" bgcolor="#F3F4F6" style="border-radius: 16px; padding: 20px 0;">
                                                <span class="otp-text" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 36px; font-weight: 800; color: #111827; letter-spacing: 8px; display: block;">
                                                    {{.OTPCode}}
                                                </span>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                            <tr>
                                <td align="center">
                                    <p style="font-size: 12px; color: #9CA3AF; margin: 0; font-weight: 500;">
                                        Rahasiakan kode ini ya 🤫
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
            <table align="center" style="margin-top: 25px; width: 100%; max-width: 460px;">
                <tr>
                    <td align="center">
                         <p style="font-size: 12px; color: #9CA3AF; line-height: 1.6; margin: 0 0 10px 0; font-style: italic;">
                            "Sebaik-baik manusia adalah yang paling bermanfaat bagi orang lain."
                        </p>
                    </td>
                </tr>
                <tr>
                    <td align="center">
                        <p style="font-size: 11px; color: #D1D5DB; margin: 0; font-weight: 600; letter-spacing: 0.5px;">
                            © 2026 KHALIF APPS
                        </p>
                    </td>
                </tr>
            </table>
        </div>
    </center>
</body>
</html>
